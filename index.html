<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#faf7f2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><meta name="description" content="Luncher — vòng quay chọn món trưa, không lặp món trong tuần."><title>Luncher · Trưa nay ăn gì?</title><script>(()=>{let p='system';try{const v=localStorage.getItem('luncher-theme');if(['light','dark','system'].includes(v))p=v}catch{}const t=p==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.dataset.themePreference=p;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t==='dark'?'#161a18':'#faf7f2');})()</script></head><body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
